[package]
name = "motiongfx"
description = "Backend agnostic motion graphics creation framework."
exclude = ["/examples/"]
keywords = ["motion", "animation", "procedural", "timeline", "agnostic"]
categories = ["no-std", "multimedia", "graphics", "visualization"]
readme = "./README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
motiongfx_interp = { workspace = true, default-features = false }
field_path = { workspace = true }
typarena = { workspace = true }
nonempty = { workspace = true }
hashbrown = { workspace = true, features = ["default-hasher"] }
indexmap = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "action_storage"
harness = false

[lints]
workspace = true

[features]
default = ["std", "tracing"]
std = ["motiongfx_interp/std"]
tracing = ["dep:tracing"]
# Records dropped clips on the compiled `Track` for editor tooling.
diagnostics = []
